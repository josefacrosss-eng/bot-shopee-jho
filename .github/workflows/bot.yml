name: Bot Shopee
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python Bot.py
